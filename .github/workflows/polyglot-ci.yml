name: Polyglot App CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  laravel-inertia:
    name: Laravel Inertia tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/laravel-inertia
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/laravel-inertia/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force
      - run: npm ci
      - run: composer test
      - run: npm run build

  php:
    name: PHP unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  react-hono:
    name: React Hono test typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/react-hono
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/react-hono/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
