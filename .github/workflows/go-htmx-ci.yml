name: go-htmx CI

on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - "apps/go-htmx/**"
      - ".github/workflows/go-htmx-ci.yml"

defaults:
  run:
    working-directory: apps/go-htmx

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-htmx/go.mod
          cache-dependency-path: apps/go-htmx/go.sum

      - name: Lint (go vet, errcheck)
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-htmx/go.mod
          cache-dependency-path: apps/go-htmx/go.sum

      - name: Run Go tests
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-htmx/go.mod
          cache-dependency-path: apps/go-htmx/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/go-htmx/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm test

      - name: Keep Playwright report from failed runs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/go-htmx/playwright-report
            apps/go-htmx/test-results
          if-no-files-found: ignore
